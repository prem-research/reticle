on: ["push", "workflow_dispatch"]

env:
    "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER": "/usr/bin/x86_64-linux-gnu-gcc"
    "PKG_CONFIG_ALLOW_CROSS": "1"
    "PKG_CONFIG_PATH": "/x86_64-sysroot/lib/pkgconfig:/x86_64-sysroot/share/pkgconfig"
    "PKG_CONFIG_SYSROOT_DIR": "/x86_64-sysroot"
    "SYSROOT": "/x86_64-sysroot"
    "WASM_PACK_VERSION": "0.15.0"

jobs:
    build-image:
        if: ${{ !endsWith(github.event.head_commit.message, '[skip-ci]') }}
        name: Build build-env Docker image
        runs-on: &x-runs-on
            group: arc-runners
        permissions:
            contents: read
            packages: write
        env:
            IMAGE_NAME: ${{ vars.REPOSITORY_URL }}/premai-io/pcci-rs
        outputs:
            image: "${{ env.IMAGE_NAME }}:latest-build"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - name: Log in to Private Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ vars.REPOSITORY_URL }}
                  username: ${{ secrets.REPOSITORY_USER }}
                  password: ${{ secrets.REPOSITORY_PASSWORD }}
            - name: Build and push
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .devcontainer
                  file: .devcontainer/Dockerfile
                  push: true
                  pull: true
                  cache-from: |
                      type=registry,ref=${{ env.IMAGE_NAME }}:cache-build
                  cache-to: |
                      type=registry,ref=${{ env.IMAGE_NAME }}:cache-build,compression=zstd
                  tags: |
                      ${{ env.IMAGE_NAME }}:latest-build
                      ${{ env.IMAGE_NAME }}:${{ github.sha }}-build

    libnvat:
        name: build libnvat
        needs: [build-image]
        runs-on: *x-runs-on
        container: &x-container
            image: ${{ needs.build-image.outputs.image }}
            credentials:
                username: ${{ secrets.REPOSITORY_USER }}
                password: ${{ secrets.REPOSITORY_PASSWORD }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: cache
              with:
                  path: |
                      ${{ env.SYSROOT }}
                  key:
                      ${{ runner.os }}-${{ hashFiles('./attestation-sdk/.git/HEAD',
                      './.devcontainer/Dockerfile') }}
            - name: build libnvat
              if: steps.cache.outputs.cache-hit != 'true'
              env:
                  "CMAKE_FIND_ROOT_PATH_MODE_INCLUDE": "BOTH"
              run: make nvidia-cpp-sdk
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: x86_64-sysroot
                  path: ${{ env.SYSROOT }}
            - name: list sysroot
              run: apt update && apt install -y tree && tree ${{ env.SYSROOT }}

    clippy:
        name: Run cargo check/clippy on all targets
        needs: [build-image, libnvat]
        strategy:
            matrix:
                package: ["nvidia-attest", "reticle"]
                target: ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu"]
        runs-on: *x-runs-on
        container: *x-container
        permissions:
            contents: read
            packages: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: x86_64-sysroot
                  path: ${{ env.SYSROOT }}
            - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              id: app-token
              with:
                  app-id: ${{ secrets.APP_ID }}
                  private-key: ${{ secrets.APP_SECRET }}
                  repositories: nvat-rs
            - name: access token git setup
              run: |
                  git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "ssh://git@github.com/"
            - name: Run Clippy
              run: |
                  rustup target add ${{ matrix.target }}
                  env -u SYSROOT -u PKG_CONFIG_SYSROOT_DIR \
                  RUSTFLAGS="-L${{ env.SYSROOT }}/lib" cargo clippy \
                      --package=${{ matrix.package }} \
                      --target=${{ matrix.target }}

    test:
        needs: [build-image, libnvat, clippy]
        name: Run unit tests
        runs-on: *x-runs-on
        container: *x-container
        permissions:
            contents: read
            packages: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: x86_64-sysroot
                  path: ${{ env.SYSROOT }}
            - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              id: app-token
              with:
                  app-id: ${{ secrets.APP_ID }}
                  private-key: ${{ secrets.APP_SECRET }}
                  repositories: nvat-rs
            - name: access token git setup
              run: |
                  git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "ssh://git@github.com/"
            - name: Set shared libraries load path
              run: echo "LD_LIBRARY_PATH=${{ env.SYSROOT }}/lib" >> "$GITHUB_ENV"
            - name: Run cargo test
              run: env -u SYSROOT RUSTFLAGS="-L${{ env.SYSROOT }}/lib -lssl -lcrypto" cargo test

    wasm:
        name: Run wasm-pack on reticle
        needs: [build-image, libnvat, test]
        runs-on: *x-runs-on
        container: *x-container
        permissions:
            contents: read
            packages: write
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: x86_64-sysroot
                  path: ${{ env.SYSROOT }}
            - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              id: app-token
              with:
                  app-id: ${{ secrets.APP_ID }}
                  private-key: ${{ secrets.APP_SECRET }}
                  repositories: nvat-rs
            - name: access token git setup
              run: |
                  git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "ssh://git@github.com/"
            - name: Install wasm-pack
              run: curl https://wasm-bindgen.github.io/wasm-pack/installer/init.sh -sSf | sh -s -- --version ${{ env.WASM_PACK_VERSION }}
            - name: Run wasm-pack build
              # fix: https://github.com/drager/wasm-pack/issues/313#issuecomment-441163923
              # pkg-node/package.json
              # pkg-node/prem_rs.js

              # pkg/package.json
              # pkg/prem_rs.js
              # pkg/prem_rs_bg.js

              run: |
                  wasm-pack build --target nodejs -d pkg-node reticle
                  wasm-pack build --target bundler -d pkg reticle
                  cd reticle
                  PKG_NAME=$(jq -r .name pkg/package.json | cut -d'/' -f2- | sed 's/\-/_/g')

                  # Merge nodejs & browser packages
                  cp "pkg-node/${PKG_NAME}.js" "pkg/${PKG_NAME}_main.cjs"
                  jq ".files += ([\"${PKG_NAME}_bg.js\", \"${PKG_NAME}_main.cjs\"] - .files) | \
                      .main = \"${PKG_NAME}_main.cjs\" | \
                      .types = \"${PKG_NAME}.d.ts\" | \
                      .exports = {
                        \".\": {
                          \"browser\": {
                            \"types\": \"./${PKG_NAME}.d.ts\",
                            \"default\": \"./${PKG_NAME}.js\"
                          },
                          \"default\": {
                            \"types\": \"./${PKG_NAME}.d.ts\",
                            \"default\": \"./${PKG_NAME}_main.cjs\"
                          }
                        },
                        \"./reticle.wasm\": \"./${PKG_NAME}_bg.wasm\"
                      }" pkg/package.json > pkg/temp.json
                  mv pkg/temp.json pkg/package.json
                  rm -rf pkg-node
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "24"
            - name: fix package.json
              run: mv reticle/pkg/package.json reticle/pkg/package.json.tmpl
            - name: Pack branch build
              if: github.ref_type == 'branch' && github.ref_name != 'main'
              working-directory: reticle/pkg
              run: |
                  jq '.name = "@premai/reticle"' package.json.tmpl > package.json
                  npm pack --pack-destination "$GITHUB_WORKSPACE"
            - name: Upload branch package
              if: github.ref_type == 'branch' && github.ref_name != 'main'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: reticle-${{ github.sha }}-${{ github.run_attempt }}
                  path: '*.tgz'
                  if-no-files-found: error
                  retention-days: 14
            - name: Publish npm package (gh)
              if:
                  github.event_name == 'push' && (github.ref == 'refs/heads/main' ||
                  startsWith(github.ref, 'refs/tags/v'))
              run: |
                  #!/bin/sh -e

                  cd reticle/pkg
                  rm .npmrc || true
                  npm config set @prem-research:registry https://npm.pkg.github.com -L project
                  echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> .npmrc
                  jq --arg name "@prem-research/`jq -r '.name' package.json.tmpl`" '.name = $name' package.json.tmpl > package.json
                  npm publish --registry=https://npm.pkg.github.com
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Publish npm package (npmjs)
              if:
                  github.event_name == 'push' && (github.ref == 'refs/heads/main' ||
                  startsWith(github.ref, 'refs/tags/v'))
              run: |
                  #!/bin/sh -e

                  cd reticle/pkg
                  rm .npmrc || true
                  npm config set @premai:registry https://registry.npmjs.org -L project
                  jq --arg name "@premai/`jq -r '.name' package.json.tmpl`" '.name = $name' package.json.tmpl > package.json
                  NPM_CONFIG_PROVENANCE=false npm publish --access public

    attestation-server:
        name: Build attestation-server docker container
        needs: [build-image, libnvat, clippy, test]
        runs-on: *x-runs-on
        container: *x-container
        env:
            IMAGE_NAME: ${{ vars.REPOSITORY_URL }}/premai-io/attestation-server
        permissions:
            contents: read
            packages: write
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: x86_64-sysroot
                  path: ${{ env.SYSROOT }}
            - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              id: app-token
              with:
                  app-id: ${{ secrets.APP_ID }}
                  private-key: ${{ secrets.APP_SECRET }}
                  repositories: nvat-rs
            - name: access token git setup
              run: |
                  git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "ssh://git@github.com/"
            - name: Set shared libraries load path
              run: echo "LD_LIBRARY_PATH=${{ env.SYSROOT }}/lib" >> "$GITHUB_ENV"
            - name: build attestation-server
              run: |
                  env -u SYSROOT \
                  RUSTFLAGS="-L${{ env.SYSROOT }}/lib -lssl -lcrypto" \
                  cargo build --release -p attestation-server
            - name: Link sysroot
              run: |
                  mv ${{ env.SYSROOT }} ./sysroot
            - name: Log in to Private Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ vars.REPOSITORY_URL }}
                  username: ${{ secrets.REPOSITORY_USER }}
                  password: ${{ secrets.REPOSITORY_PASSWORD }}
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Docker meta
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              env:
                  DOCKER_METADATA_SHORT_SHA_LENGTH: 7
              with:
                  images: |
                      ${{ env.IMAGE_NAME }}
                      ghcr.io/${{ github.repository }}
                  tags: |
                      type=sha,prefix=
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
                      type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              name: Build and push
              with:
                  context: ./
                  file: ./attestation-server/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      SYSROOT=./sysroot
