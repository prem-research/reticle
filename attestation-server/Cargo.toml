[package]
name = "attestation-server"
version = "0.1.0"
edition = "2024"

[features]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
sev = { workspace = true, default-features = false, features = ["crypto_nossl", "snp"] }
rocket = { version = "0.5.1", features = ["json"] }
anyhow = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
nvat = { git = "https://github.com/prem-research/nvat-rs.git", branch = "main" }

libattest = { path = "../libattest" }
nvidia-attest = { path = "../nvidia-attest" }
azure-attest = { path = "../azure-attest", features = ["host"] }
attestation-protocol = { path = "../attestation-protocol" }

snp-attest = { path = "../snp-attest", default-features = false }
env_logger = "0.11.8"
log = "0.4.29"
configfs-tsm = { version = "0.0.2" }
nvml-wrapper = "0.12.1"
reqwest = { workspace = true, features = ["blocking", "json"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
