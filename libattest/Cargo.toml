[package]
name = "libattest"
version = "0.1.0"
edition = "2024"

[dependencies]
getrandom = "0.4.1"
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
regorus = { git = "https://github.com/microsoft/regorus.git", default-features = false, features = ["arc", "rvm", "regex", "std", "coverage"] }
# serde_json = "1.0.149"
serde-value = "0.7.0"
x509-cert = { workspace = true }
sha2 = "0.11.0"
p256 = "0.14.0-rc.14"
signature = "3.0"
sec1 = "0.8.1"
spki = "0.8.0"
thiserror = { workspace = true }
der = "0.8.0"
rsa = { workspace = true, features = ["serde"] }
digest = "0.11.3"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
getrandom = { version = "0.4.2", features = ["wasm_js"] }
js-sys = "0.3.93"
web-time.workspace = true
